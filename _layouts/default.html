<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.hero_title | default: page.title | default: site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
</head>
<body>
  <header class="site-hero">
    <div class="aurora-band" aria-hidden="true"></div>
    <div class="wrap site-hero-inner">
      <a class="home-link" href="{{ '/' | relative_url }}">&larr; Trip hub</a>
      <h1>{{ page.hero_title | default: page.title | default: site.title }}</h1>
      {% if page.hero_sub %}<p class="sub">{{ page.hero_sub }}</p>{% endif %}
      {% if page.date %}<p class="sub article-date">{{ page.date | date: "%B %-d, %Y" }}</p>{% endif %}
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
