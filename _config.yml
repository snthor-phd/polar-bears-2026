title: "Northern Lights & Polar Bears - 2026 Caravan"
description: "The 2026 Northern Lights & Polar Bears RV caravan up Manitoba to Churchill."
url: "https://snthor-phd.github.io"
baseurl: "/polar-bears-2026"

collections:
  articles:
    output: true
    permalink: /articles/:name/

defaults:
  # Everything is searchable unless a page sets `search: false` in its front matter.
  # For content that must not ship at all, use `exclude:` below instead — that keeps it
  # out of the build entirely, which is stronger than hiding it from search.
  - scope:
      path: ""
    values:
      search: true
  - scope:
      path: ""
      type: articles
    values:
      layout: article
      search: true

exclude:
  - deploy.sh
  - README.md
  - CUSTOM_DOMAIN.md
  # Local-build housekeeping. GitHub Pages ignores these anyway, but a local
  # `bundle exec jekyll build` will try to read the installed gems as content
  # and fail on Jekyll's own sample post unless vendor/ is excluded.
  - vendor/
  - Gemfile
  - Gemfile.lock
  - .bundle/
